name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Create the Android project (android/ is generated, not committed)
        working-directory: android-app
        run: npx cap add android

      - name: Sign every build with the fixed key (updates keep app data + login)
        working-directory: android-app
        run: |
          cp chatbash-signing.p12 android/chatbash-signing.p12
          python3 - <<'PYEOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          s += """
          android {
              signingConfigs {
                  fixed {
                      storeFile file('../chatbash-signing.p12')
                      storeType 'PKCS12'
                      storePassword 'chatbash-key-2026'
                      keyAlias 'chatbash'
                      keyPassword 'chatbash-key-2026'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
                  release { signingConfig signingConfigs.fixed }
              }
          }
          """
          open(p, 'w').write(s)
          print('signing patched')
          PYEOF

      - name: Add deep-link intent filter (chatbash://login returns sign-in to the app)
        working-directory: android-app
        run: |
          python3 - <<'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'chatbash' not in s:
              filt = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="chatbash" android:host="login" />
              </intent-filter>
              '''
              i = s.index('.MainActivity')
              j = s.index('</activity>', i)
              s = s[:j] + filt + s[j:]
              open(p, 'w').write(s)
          print('manifest patched')
          PYEOF

      - name: Generate launcher icons
        working-directory: android-app
        run: npx capacitor-assets generate --android

      - name: Sync web files into Android
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK (release — a debuggable build is a Play Protect risk signal)
        working-directory: android-app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ChatBash.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ChatBash-apk
          path: ChatBash.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChatBash.apk

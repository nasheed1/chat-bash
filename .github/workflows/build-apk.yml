name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Create the Android project (android/ is generated, not committed)
        working-directory: android-app
        run: npx cap add android

      - name: Wire Firebase config + fixed signing key
        working-directory: android-app
        run: |
          cp google-services.json android/app/google-services.json
          cp chatbash-signing.p12 android/chatbash-signing.p12
          python3 - <<'PYEOF'
          # app module: apply google-services plugin + sign every build with the fixed key
          p = 'android/app/build.gradle'
          s = open(p).read()
          if 'google-services' not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"
          s += """
          android {
              signingConfigs {
                  fixed {
                      storeFile file('../chatbash-signing.p12')
                      storeType 'PKCS12'
                      storePassword 'chatbash-key-2026'
                      keyAlias 'chatbash'
                      keyPassword 'chatbash-key-2026'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
                  release { signingConfig signingConfigs.fixed }
              }
          }
          """
          open(p, 'w').write(s)
          # root build file: make sure the google-services classpath exists
          p2 = 'android/build.gradle'
          s2 = open(p2).read()
          if 'com.google.gms:google-services' not in s2:
              s2 = s2.replace('dependencies {', "dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'", 1)
              open(p2, 'w').write(s2)
          print('gradle patched')
          PYEOF

      - name: Generate launcher icons
        working-directory: android-app
        run: npx capacitor-assets generate --android

      - name: Sync web files into Android
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android-app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ChatBash.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ChatBash-apk
          path: ChatBash.apk
          if-no-files-found: error

      - name: Attach APK to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChatBash.apk
